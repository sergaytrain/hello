<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Новости — Hello!</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0A0C; color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh; padding: 40px;
            display: flex; flex-direction: column; align-items: center;
        }
        .app-container { width: 100%; max-width: 1200px; animation: fadeInUp 0.6s ease; }
        @keyframes fadeInUp { 0% { opacity: 0; transform: translateY(24px); } 100% { opacity: 1; transform: translateY(0); } }
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 0;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(25px); border-bottom: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px; margin-bottom: 40px;
        }
        .logo-link { text-decoration: none; color: #fff; font-size: 1.25rem; font-weight: 600; padding-left: 20px; }
        .nav-links { display: flex; gap: 32px; padding-right: 20px; }
        .nav-links a { text-decoration: none; color: rgba(255,255,255,0.7); font-weight: 500; transition: 0.3s; }
        .nav-links a:hover { color: #DCD0FF; transform: scale(1.05); }
        .page-title { font-size: 2rem; font-weight: 600; margin-bottom: 32px; }
        .news-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 32px;
        }
        .news-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px; overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            transition: 0.3s;
        }
        .news-card:hover {
            transform: translateY(-6px);
            border-color: rgba(220,208,255,0.15);
            box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 15px rgba(220,208,255,0.1);
        }
        .news-card img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .news-body { padding: 24px; }
        .news-date { font-size: 0.85rem; color: rgba(255,255,255,0.5); margin-bottom: 8px; }
        .news-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; color: #fff; }
        .news-text { font-size: 0.95rem; color: rgba(255,255,255,0.65); line-height: 1.5; }
        .footer { margin-top: 60px; text-align: center; color: rgba(255,255,255,0.4); font-size: 0.85rem; }
        .footer a { color: rgba(255,255,255,0.6); text-decoration: none; }
        @media (max-width: 600px) { .nav-links { display: none; } }
    </style>
</head>
<body>
<div class="app-container">
    <div class="navbar">
        <a href="../index.html" class="logo-link">👋 Hello!</a>
        <div class="nav-links">
            <a href="../news/">Новости</a>
            <a href="../tutorial/">Туториалы</a>
            <a href="../settings/">Настройки</a>
            <a href="../about/">О проекте</a>
        </div>
    </div>
    <div class="page-title">Новости</div>
    <div class="news-grid" id="newsGrid"></div>
    <div class="footer">2026 · <a href="../about/">Hello!</a></div>
</div>
<script>
    const news = [
        { date: '7 мая 2026', title: 'Премиум-редизайн', text: 'Полностью обновлён интерфейс: глубокий тёмный фон, стеклянные панели, неоновые акценты.', img: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600' },
        { date: '4 мая 2026', title: 'Фирменные цвета и новости', text: 'Добавлен уникальный градиент и страница новостей.', img: 'https://images.unsplash.com/photo-1557683316-973673baf926?w=600' },
        { date: '3 мая 2026', title: 'Динамический фон', text: 'Поддержка сменяющихся обоев из images-list.json.', img: '' }
    ];
    const grid = document.getElementById('newsGrid');
    grid.innerHTML = news.map(n => `
        <div class="news-card">
            ${n.img ? `<img src="${n.img}" alt="">` : ''}
            <div class="news-body">
                <div class="news-date">${n.date}</div>
                <div class="news-title">${n.title}</div>
                <div class="news-text">${n.text}</div>
            </div>
        </div>
    `).join('');
</script>
</body>
</html>
