<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hello! — Новая вкладка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #f2f2f7;
            --bg-card: rgba(255, 255, 255, 0.6);
            --text-primary: #1c1c1e;
            --text-secondary: #6e6e73;
            --accent: #6C5CE7;
            --accent-glow: rgba(108, 92, 231, 0.3);
            --gradient-start: #6C5CE7;
            --gradient-end: #0088ff;
            --separator: rgba(60, 60, 67, 0.12);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 32px rgba(0,0,0,0.06);
            --blur-strong: saturate(220%) blur(40px);
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --border-radius-card: 24px;
            --menu-bg: rgba(255,255,255,0.9);
            --nav-bg: rgba(255,255,255,0.2);
        }
        body.dark {
            --bg-primary: #000000;
            --bg-card: rgba(28, 28, 30, 0.65);
            --text-primary: #ffffff;
            --text-secondary: #aeaeb2;
            --accent: #8B7CF7;
            --accent-glow: rgba(139, 124, 247, 0.35);
            --gradient-start: #6C5CE7;
            --gradient-end: #00a6ff;
            --separator: rgba(84, 84, 88, 0.5);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 32px rgba(0,0,0,0.5);
            --menu-bg: rgba(28,28,30,0.92);
            --nav-bg: rgba(28,28,30,0.3);
        }
        body {
            font-family: -apple-system, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color var(--transition), color var(--transition);
            overflow: hidden;
            position: relative;
            padding: 20px;
        }
        .bg-layer {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }
        .bg-layer.active { opacity: 1; }
        .app-container {
            width: 100%;
            max-width: 560px;
            height: 100%;
            max-height: 750px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
            animation: fadeSlideIn 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        @keyframes fadeSlideIn {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .navbar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 8px 0; flex-shrink: 0; position: relative; z-index: 20; }
        .logo-link { text-decoration: none; color: var(--text-primary); font-size: 1.375rem; font-weight: 650; letter-spacing: -0.02em; transition: opacity 0.2s; display: flex; align-items: center; gap: 6px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); background: var(--nav-bg); padding: 6px 16px; border-radius: 20px; box-shadow: 0 0 10px var(--accent-glow); }
        .logo-link:hover { opacity: 0.8; }
        .nav-links { display: flex; gap: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); background: var(--nav-bg); padding: 4px; border-radius: 24px; box-shadow: 0 0 8px var(--accent-glow); }
        .nav-links a { text-decoration: none; color: var(--text-primary); font-weight: 500; font-size: 0.95rem; padding: 8px 16px; border-radius: 20px; background: transparent; transition: background 0.2s, color 0.2s; }
        .nav-links a:hover { background: var(--accent); color: white; }
        .burger-btn { display: none; flex-direction: column; justify-content: center; align-items: center; width: 44px; height: 44px; background: transparent; border: none; cursor: pointer; z-index: 30; gap: 5px; padding: 8px; }
        .burger-btn span { display: block; width: 22px; height: 2px; background: var(--accent); border-radius: 8px; transition: 0.3s cubic-bezier(0.4,0,0.2,1); }
        .burger-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .burger-btn.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
        .burger-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
        .mobile-menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; visibility: hidden; transition: opacity 0.35s ease, visibility 0.35s; z-index: 18; }
        .mobile-menu-overlay.active { opacity: 1; visibility: visible; }
        .mobile-menu { position: fixed; top: 0; right: -100%; width: 280px; height: 100%; background: var(--menu-bg); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); box-shadow: -8px 0 30px rgba(0,0,0,0.12); z-index: 22; display: flex; flex-direction: column; padding: 32px 24px; transition: right 0.45s cubic-bezier(0.23, 1, 0.32, 1); gap: 12px; }
        .mobile-menu.active { right: 0; }
        .mobile-menu a { font-size: 1.3rem; font-weight: 500; color: var(--text-primary); text-decoration: none; padding: 14px 0; border-bottom: 1px solid var(--separator); }
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; gap: 20px; }
        .big-logo { font-size: 4.2rem; font-weight: 580; letter-spacing: -0.04em; color: var(--text-primary); text-shadow: 0 0 15px var(--accent-glow); animation: logoReveal 0.7s ease-out; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        @keyframes logoReveal { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .search-area { width: 100%; display: flex; flex-direction: column; gap: 8px; }
        .search-wrapper { width: 100%; background: var(--bg-card); backdrop-filter: var(--blur-strong); -webkit-backdrop-filter: var(--blur-strong); border-radius: var(--border-radius-card); box-shadow: var(--shadow-md), 0 0 20px var(--accent-glow); padding: 16px 20px; transition: all var(--transition); border: 1px solid rgba(108, 92, 231, 0.2); }
        .search-wrapper:focus-within { transform: scale(1.02); box-shadow: 0 12px 40px rgba(108, 92, 231, 0.3); border-color: var(--accent); }
        .search-input { width: 100%; border: none; background: transparent; font-size: 1.1rem; color: var(--text-primary); outline: none; }
        .search-input::placeholder { color: var(--text-secondary); font-weight: 400; }
        .history { width: 100%; }
        .history-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg-card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; margin-bottom: 6px; font-size: 0.95rem; transition: background 0.2s; }
        .history-item:hover { background: rgba(108, 92, 231, 0.1); }
        .history-text { cursor: pointer; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; color: var(--text-primary); }
        .history-delete { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.2rem; padding: 0 4px; transition: color 0.2s; }
        .history-delete:hover { color: var(--accent); }
        .iframe-container { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); display: flex; flex-direction: column; }
        .iframe-header { display: flex; justify-content: flex-end; padding: 12px; }
        .iframe-close, .iframe-open-tab { background: var(--accent); border: none; color: white; padding: 8px 16px; margin-left: 8px; border-radius: 20px; cursor: pointer; font-weight: 500; backdrop-filter: blur(10px); }
        iframe { flex: 1; border: none; background: white; }
        .footer { flex-shrink: 0; text-align: center; padding: 16px 0 8px; font-size: 0.85rem; color: var(--text-secondary); width: 100%; }
        .footer a { color: var(--accent); text-decoration: none; }
        @media (max-width: 600px) {
            body { padding: 16px; }
            .nav-links { display: none; }
            .burger-btn { display: flex; }
            .big-logo { font-size: 2.8rem; }
            .app-container { max-height: 100%; }
        }
    </style>
</head>
<body class="light">
<div class="bg-layer" id="bgLayer"></div>
<div class="app-container">
    <div class="navbar">
        <a href="index.html" class="logo-link">👋 Hello!</a>
        <div class="nav-links">
            <a href="news/">Новости</a>
            <a href="tutorial/">Туториалы</a>
            <a href="settings/">Настройки</a>
            <a href="about/">О проекте</a>
        </div>
        <button class="burger-btn" id="burgerBtn" aria-label="Меню">
            <span></span><span></span><span></span>
        </button>
    </div>
    <div class="main-content">
        <div class="big-logo">Hello!</div>
        <div class="search-area">
            <div class="search-wrapper">
                <input type="text" class="search-input" placeholder="Введите запрос или URL" id="searchInput" autocomplete="off" autofocus>
            </div>
            <div class="history" id="historyContainer"></div>
        </div>
    </div>
    <div class="footer">
        <p>2026, <a href="about/">«hello!»</a>.</p>
    </div>
</div>
<div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>
<div class="mobile-menu" id="mobileMenu">
    <a href="news/">Новости</a>
    <a href="tutorial/">Туториалы</a>
    <a href="settings/">Настройки</a>
    <a href="about/">О проекте</a>
</div>
<div class="iframe-container" id="iframeContainer" style="display: none;">
    <div class="iframe-header">
        <button class="iframe-open-tab" id="iframeOpenTab">Открыть в новой вкладке</button>
        <button class="iframe-close" id="iframeClose">Закрыть</button>
    </div>
    <iframe id="searchIframe" sandbox="allow-scripts allow-popups allow-forms allow-same-origin"></iframe>
</div>
<script>
    (() => {
        const body = document.body;
        const savedTheme = localStorage.getItem('hello-theme');
        if (savedTheme === 'dark') body.classList.add('dark');
        else body.classList.remove('dark');

        const searchInput = document.getElementById('searchInput');
        const historyContainer = document.getElementById('historyContainer');
        const iframeContainer = document.getElementById('iframeContainer');
        const searchIframe = document.getElementById('searchIframe');
        const iframeClose = document.getElementById('iframeClose');
        const iframeOpenTab = document.getElementById('iframeOpenTab');
        let currentSearchUrl = '';
        let iframeTimeout = null;

        // Автофокус
        searchInput?.focus();

        // История поиска – максимум 5 элементов
        let history = JSON.parse(localStorage.getItem('hello-search-history') || '[]');
        const MAX_HISTORY = 5;

        function saveHistory() {
            localStorage.setItem('hello-search-history', JSON.stringify(history));
        }

        function renderHistory() {
            if (!historyContainer) return;
            if (history.length === 0) {
                historyContainer.innerHTML = '';
                return;
            }
            historyContainer.innerHTML = history.map((entry, index) => `
                <div class="history-item">
                    <span class="history-text" data-index="${index}" title="${entry}">${entry}</span>
                    <button class="history-delete" data-index="${index}" aria-label="Удалить">✕</button>
                </div>
            `).join('');

            // Обработчики клика по тексту – вставка в строку поиска
            historyContainer.querySelectorAll('.history-text').forEach(span => {
                span.addEventListener('click', () => {
                    searchInput.value = span.title;
                    searchInput.focus();
                });
            });

            // Обработчики удаления
            historyContainer.querySelectorAll('.history-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.dataset.index);
                    history.splice(idx, 1);
                    saveHistory();
                    renderHistory();
                });
            });
        }

        function addToHistory(query) {
            if (!query.trim()) return;
            // Удаляем дубликат, если есть
            history = history.filter(item => item !== query);
            // Добавляем в начало
            history.unshift(query);
            // Обрезаем до MAX_HISTORY
            if (history.length > MAX_HISTORY) history.pop();
            saveHistory();
            renderHistory();
        }

        renderHistory();

        // Определение URL
        function isUrl(text) {
            return /^(https?:\/\/)?[\w\-]+(\.[\w\-]+)+[/#?]?.*$/i.test(text);
        }

        function openInNewTab(url) {
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
            window.open(url, '_blank');
        }

        function closeIframe() {
            iframeContainer.style.display = 'none';
            searchIframe.src = '';
            if (iframeTimeout) clearTimeout(iframeTimeout);
        }

        function performSearch(query) {
            if (!query.trim()) return;
            addToHistory(query);
            if (isUrl(query)) {
                openInNewTab(query);
                return;
            }
            const engine = localStorage.getItem('hello-search-engine') || 'google';
            const urls = {
                yandex: 'https://yandex.ru/search/?text=',
                google: 'https://www.google.com/search?q=',
                brave: 'https://search.brave.com/search?q=',
                bing: 'https://www.bing.com/search?q=',
                yahoo: 'https://search.yahoo.com/search?p=',
                baidu: 'https://www.baidu.com/s?wd=',
                '360search': 'https://www.so.com/s?q=',
                shenma: 'https://m.sm.cn/s?q='
            };
            currentSearchUrl = (urls[engine] || urls.google) + encodeURIComponent(query);
            searchIframe.src = currentSearchUrl;
            iframeContainer.style.display = 'flex';

            // Таймер: если iframe не загрузился за 3 секунды, открываем в новой вкладке
            if (iframeTimeout) clearTimeout(iframeTimeout);
            iframeTimeout = setTimeout(() => {
                // Проверяем, видим ли мы iframe (возможно, он уже закрыт)
                if (iframeContainer.style.display === 'flex') {
                    closeIframe();
                    openInNewTab(currentSearchUrl);
                }
            }, 3000);
        }

        // Событие загрузки iframe – если загрузился успешно, отменяем таймер
        searchIframe.addEventListener('load', () => {
            if (iframeTimeout) {
                clearTimeout(iframeTimeout);
                iframeTimeout = null;
            }
        });

        searchInput?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch(searchInput.value);
                searchInput.value = '';
            }
        });

        iframeClose?.addEventListener('click', closeIframe);
        iframeOpenTab?.addEventListener('click', () => {
            if (currentSearchUrl) window.open(currentSearchUrl, '_blank');
        });

        // Escape для закрытия iframe
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && iframeContainer.style.display === 'flex') {
                closeIframe();
            }
        });

        // Динамический фон
        const bgLayer = document.getElementById('bgLayer');
        let validUrls = [];
        let currentIndex = 0;
        let bgInterval = null;
        async function initDynamicBackground() {
            const enabled = localStorage.getItem('hello-dynamic-bg') === 'true';
            if (!enabled || !bgLayer) { if (bgLayer) bgLayer.style.display = 'none'; return; }
            try {
                const response = await fetch('images-list.json');
                if (!response.ok) throw new Error('No images list');
                const filenames = await response.json();
                if (!Array.isArray(filenames) || filenames.length === 0) throw new Error('Empty list');
                validUrls = [];
                for (const name of filenames) {
                    const url = 'images/' + name;
                    try { const head = await fetch(url, { method: 'HEAD' }); if (head.ok) validUrls.push(url); } catch (e) {}
                }
                if (validUrls.length === 0) { bgLayer.style.display = 'none'; return; }
                bgLayer.style.display = 'block';
                function showImage(index) { bgLayer.style.backgroundImage = `url(${validUrls[index]})`; bgLayer.classList.add('active'); }
                showImage(0); currentIndex = 0;
                if (bgInterval) clearInterval(bgInterval);
                bgInterval = setInterval(() => { currentIndex = (currentIndex + 1) % validUrls.length; bgLayer.classList.remove('active'); setTimeout(() => showImage(currentIndex), 500); }, 15000);
            } catch (err) { if (bgLayer) bgLayer.style.display = 'none'; }
        }
        initDynamicBackground();

        // Бургер-меню
        const burger = document.getElementById('burgerBtn');
        const overlay = document.getElementById('mobileMenuOverlay');
        const menu = document.getElementById('mobileMenu');
        function openMenu() { burger.classList.add('open'); overlay.classList.add('active'); menu.classList.add('active'); }
        function closeMenu() { burger.classList.remove('open'); overlay.classList.remove('active'); menu.classList.remove('active'); }
        burger?.addEventListener('click', () => { menu.classList.contains('active') ? closeMenu() : openMenu(); });
        overlay?.addEventListener('click', closeMenu);
        menu?.querySelectorAll('a').forEach(link => link.addEventListener('click', closeMenu));
    })();
</script>
</body>
</html>
