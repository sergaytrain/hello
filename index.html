<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hello! — Премиум поиск</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0A0A0C;
            color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            padding: 20px;
            transition: 0.3s;
        }
        body.light {
            background-color: #f2f2f7;
            color: #1c1c1e;
        }
        .app-container {
            width: 100%; max-width: 640px;
            height: 100%; max-height: 800px;
            display: flex; flex-direction: column;
            justify-content: space-between; align-items: center;
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(24px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        /* Навигация */
        .navbar {
            width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 0;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .logo-link {
            text-decoration: none; color: #fff;
            font-size: 1.25rem; font-weight: 600;
            display: flex; align-items: center; gap: 8px;
            padding: 0 20px;
        }
        .nav-links { display: flex; gap: 32px; padding-right: 20px; }
        .nav-links a {
            text-decoration: none; color: rgba(255,255,255,0.7); font-weight: 500;
            font-size: 0.95rem; transition: 0.3s;
        }
        .nav-links a:hover {
            color: #DCD0FF;
            transform: scale(1.05);
        }
        /* Главный контент */
        .main-content {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            width: 100%; gap: 40px;
        }
        .big-logo {
            font-size: clamp(64px, 10vw, 120px); font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #DCD0FF, #87CEEB);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }
        .search-area { width: 100%; position: relative; }
        .search-wrapper {
            width: 100%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 18px 24px;
            display: flex; align-items: center; gap: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.08);
            transition: all 0.3s ease;
        }
        .search-wrapper:focus-within {
            transform: scale(1.01);
            border-color: rgba(220,208,255,0.2);
            box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 30px rgba(220,208,255,0.15);
        }
        .search-icon { font-size: 1.5rem; opacity: 0.5; }
        .search-input {
            width: 100%; border: none; background: transparent;
            font-size: 1.1rem; color: #fff; outline: none;
            font-family: 'Inter', sans-serif;
        }
        .search-input::placeholder { color: rgba(255,255,255,0.4); }
        /* Выпадающая история */
        .history-dropdown {
            position: absolute; top: calc(100% + 8px); left: 0; right: 0;
            background: rgba(255,255,255,0.05); backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; padding: 8px 0;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
            opacity: 0; visibility: hidden;
            transform: translateY(-8px);
            transition: 0.25s ease;
            z-index: 10;
            max-height: 260px; overflow-y: auto;
        }
        .history-dropdown.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .history-item {
            display: flex; align-items: center; padding: 12px 20px;
            cursor: pointer; transition: background 0.2s;
        }
        .history-item:hover { background: rgba(255,255,255,0.05); }
        .history-icon { margin-right: 12px; opacity: 0.6; font-size: 1.1rem; }
        .history-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .history-delete {
            background: none; border: none; color: rgba(255,255,255,0.4);
            cursor: pointer; font-size: 1.2rem; padding: 4px 8px; transition: 0.2s;
        }
        .history-delete:hover { color: #DCD0FF; }
        /* Футер */
        .footer {
            width: 100%; text-align: center;
            padding: 20px 0; font-size: 0.8rem; color: rgba(255,255,255,0.4);
            font-weight: 300;
        }
        .footer a { color: rgba(255,255,255,0.6); text-decoration: none; }
        /* Адаптив */
        @media (max-width: 600px) {
            .nav-links { display: none; }
            .burger-btn { display: flex; }
        }
        .burger-btn { display: none; }
    </style>
</head>
<body class="dark">
<div class="app-container">
    <div class="navbar">
        <a href="index.html" class="logo-link">👋 Hello!</a>
        <div class="nav-links">
            <a href="news/">Новости</a>
            <a href="tutorial/">Туториалы</a>
            <a href="settings/">Настройки</a>
            <a href="about/">О проекте</a>
        </div>
    </div>

    <div class="main-content">
        <div class="big-logo">Hello!</div>
        <div class="search-area">
            <div class="search-wrapper" id="searchWrapper">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" placeholder="Поиск в интернете…" id="searchInput" autocomplete="off" autofocus>
            </div>
            <div class="history-dropdown" id="historyDropdown"></div>
        </div>
    </div>

    <div class="footer">2026 · <a href="about/">Hello!</a></div>
</div>

<script>
    (() => {
        // Тема (dark по умолчанию)
        const body = document.body;
        if (!localStorage.getItem('hello-theme')) localStorage.setItem('hello-theme', 'dark');
        body.className = localStorage.getItem('hello-theme');

        const searchInput = document.getElementById('searchInput');
        const historyDropdown = document.getElementById('historyDropdown');
        const MAX_HISTORY = 5;
        let history = JSON.parse(localStorage.getItem('hello-search-history') || '[]');

        function saveHistory() {
            localStorage.setItem('hello-search-history', JSON.stringify(history));
        }

        function renderHistoryDropdown() {
            if (!historyDropdown || history.length === 0) {
                historyDropdown.classList.remove('show');
                return;
            }
            historyDropdown.innerHTML = history.map((entry, i) => `
                <div class="history-item" data-query="${entry.replace(/"/g, '&quot;')}" data-index="${i}">
                    <span class="history-icon">🕒</span>
                    <span class="history-text">${entry}</span>
                    <button class="history-delete" data-index="${i}">✕</button>
                </div>
            `).join('');

            historyDropdown.querySelectorAll('.history-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.classList.contains('history-delete')) return;
                    performSearch(item.dataset.query);
                });
            });
            historyDropdown.querySelectorAll('.history-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    history.splice(parseInt(btn.dataset.index), 1);
                    saveHistory();
                    renderHistoryDropdown();
                    if (history.length === 0) historyDropdown.classList.remove('show');
                });
            });
        }
        renderHistoryDropdown();

        function addToHistory(query) {
            if (!query.trim()) return;
            history = history.filter(item => item !== query);
            history.unshift(query);
            if (history.length > MAX_HISTORY) history.pop();
            saveHistory();
            renderHistoryDropdown();
        }

        function isUrl(text) {
            return /^(https?:\/\/)?[\w\-]+(\.[\w\-]+)+[/#?]?.*$/i.test(text);
        }

        function performSearch(query) {
            addToHistory(query);
            if (isUrl(query)) {
                window.open(query.startsWith('http') ? query : 'https://' + query, '_blank');
            } else {
                const engine = localStorage.getItem('hello-search-engine') || 'google';
                const urls = {
                    yandex: 'https://yandex.ru/search/?text=',
                    google: 'https://www.google.com/search?q=',
                    brave: 'https://search.brave.com/search?q=',
                    bing: 'https://www.bing.com/search?q=',
                    yahoo: 'https://search.yahoo.com/search?p=',
                    baidu: 'https://www.baidu.com/s?wd=',
                    '360search': 'https://www.so.com/s?q=',
                    shenma: 'https://m.sm.cn/s?q='
                };
                window.open((urls[engine] || urls.google) + encodeURIComponent(query), '_blank');
            }
            searchInput.value = '';
            historyDropdown.classList.remove('show');
        }

        searchInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') performSearch(searchInput.value);
        });

        searchInput.addEventListener('focus', () => {
            if (history.length > 0 && searchInput.value.trim() === '') {
                historyDropdown.classList.add('show');
            }
        });
        searchInput.addEventListener('blur', () => {
            setTimeout(() => {
                if (!historyDropdown.contains(document.activeElement)) {
                    historyDropdown.classList.remove('show');
                }
            }, 150);
        });
        searchInput.addEventListener('input', () => {
            historyDropdown.classList.remove('show');
            if (searchInput.value.trim() === '' && history.length > 0) {
                historyDropdown.classList.add('show');
            }
        });
})();
</script>
</body>
</html>
