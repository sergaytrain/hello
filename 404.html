<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>404 — Страница не найдена | Hello!</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0A0C;
            color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 60px 48px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.05);
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(24px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .error-code {
            font-size: clamp(72px, 15vw, 120px);
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #DCD0FF, #87CEEB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            margin-bottom: 16px;
        }
        .error-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.9);
        }
        .error-message {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .home-button {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .home-button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #DCD0FF;
            box-shadow: 0 0 20px rgba(220, 208, 255, 0.15);
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            font-weight: 300;
        }
        .footer a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer a:hover {
            color: #DCD0FF;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="error-code">404</div>
        <div class="error-title">Страница не найдена</div>
        <p class="error-message">
            Кажется, этой страницы не существует.<br>
            Возможно, она была перемещена или вы набрали неправильный адрес.
        </p>
        <a href="index.html" class="home-button">← Вернуться на главную</a>
        <div class="footer">
            2026 · <a href="about/">Hello!</a>
        </div>
    </div>
</body>
</html>
