<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Туториалы — Hello!</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0A0C; color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh; padding: 40px;
            display: flex; flex-direction: column; align-items: center;
        }
        .app-container { width: 100%; max-width: 900px; animation: fadeInUp 0.6s; }
        @keyframes fadeInUp { 0% { opacity: 0; transform: translateY(24px); } 100% { opacity: 1; transform: translateY(0); } }
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 0;
            background: rgba(255,255,255,0.03); backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(255,255,255,0.06); border-radius: 16px; margin-bottom: 40px;
        }
        .logo-link { text-decoration: none; color: #fff; font-size: 1.25rem; font-weight: 600; padding-left: 20px; }
        .nav-links { display: flex; gap: 32px; padding-right: 20px; }
        .nav-links a { text-decoration: none; color: rgba(255,255,255,0.7); transition: 0.3s; }
        .nav-links a:hover { color: #DCD0FF; transform: scale(1.05); }
        .page-title { font-size: 2rem; font-weight: 600; margin-bottom: 32px; }
        .platform-selector { display: flex; gap: 8px; margin-bottom: 32px; }
        .platform-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            padding: 10px 20px; border-radius: 14px; color: rgba(255,255,255,0.7);
            cursor: pointer; transition: 0.3s; font-weight: 500; backdrop-filter: blur(10px);
        }
        .platform-btn.active, .platform-btn:hover {
            background: linear-gradient(135deg, #DCD0FF, #87CEEB); color: #0A0A0C; border-color: transparent;
        }
        .browser-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
        .browser-card {
            background: rgba(255,255,255,0.03); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06); border-radius: 20px;
            padding: 24px; display: flex; align-items: center; gap: 16px;
            transition: 0.3s; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .browser-card:hover {
            transform: translateY(-6px); border-color: rgba(220,208,255,0.15);
            box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 15px rgba(220,208,255,0.1);
        }
        .browser-icon { font-size: 2rem; }
        .browser-info h4 { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
        .browser-info p { font-size: 0.85rem; color: rgba(255,255,255,0.6); line-height: 1.4; }
        .footer { margin-top: 60px; text-align: center; color: rgba(255,255,255,0.4); font-size: 0.85rem; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="navbar">
        <a href="../index.html" class="logo-link">👋 Hello!</a>
        <div class="nav-links">
            <a href="../news/">Новости</a>
            <a href="../tutorial/">Туториалы</a>
            <a href="../settings/">Настройки</a>
            <a href="../about/">О проекте</a>
        </div>
    </div>
    <div class="page-title">Туториалы</div>
    <div class="platform-selector" id="platformSelector"></div>
    <div class="browser-grid" id="browserGrid"></div>
    <div class="footer">2026 · Hello!</div>
</div>
<script>
    const tutorials = {
        windows: [
            { name: 'Google Chrome', icon: '🌐', instruction: 'Настройки → Внешний вид → Показывать кнопку Главная страница. Введите адрес Hello!' },
            { name: 'Edge', icon: '🔷', instruction: 'Настройки → Запуск → Домашняя страница. Укажите URL.' }
        ],
        macos: [
            { name: 'Safari', icon: '🧭', instruction: 'Safari → Настройки → Основные → Домашняя страница.' }
        ],
        ios: [
            { name: 'Safari', icon: '📱', instruction: 'Поделиться → На экран Домой, затем Настройки Safari.' }
        ]
    };
    const platforms = ['windows', 'macos', 'ios'];
    const selector = document.getElementById('platformSelector');
    const grid = document.getElementById('browserGrid');

    function renderPlatform(platform) {
        selector.innerHTML = platforms.map(p => `
            <button class="platform-btn ${p === platform ? 'active' : ''}" data-platform="${p}">${p}</button>
        `).join('');
        document.querySelectorAll('.platform-btn').forEach(btn => {
            btn.addEventListener('click', () => renderPlatform(btn.dataset.platform));
        });
        grid.innerHTML = tutorials[platform].map(b => `
            <div class="browser-card">
                <div class="browser-icon">${b.icon}</div>
                <div class="browser-info">
                    <h4>${b.name}</h4>
                    <p>${b.instruction}</p>
                </div>
            </div>
        `).join('');
    }
    renderPlatform('windows');
</script>
</body>
</html>
